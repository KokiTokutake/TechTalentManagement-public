name: 機能追加・要件定義
description: 新機能の追加または既存機能の変更を提案する
title: "[Feature] "
labels: ["enhancement"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        ## 仕様書との紐付けについて
        この Issue は仕様書（`docs/spec/`）と対になります。
        Issue で合意が取れたら、仕様書を作成・更新してから実装を始めてください。

  - type: textarea
    id: why
    attributes:
      label: 背景・目的（Why）
      description: なぜこの機能が必要か。解決したい課題・ユーザーの困りごとを記述してください。
      placeholder: |
        現在、〇〇という課題があり、ユーザーは△△という状況に置かれています。
        この機能により、□□を実現したいと考えています。
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: 実現したいこと（What）
      description: 何を実現したいか。実装方法（How）ではなく、達成したいことを記述してください。
      placeholder: |
        - ユーザーが〇〇できるようになる
        - △△が自動的に□□される
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 受入イメージ
      description: どうなれば「完成」と判断できるか、具体的なイメージを記述してください。
      placeholder: |
        - 〇〇の画面で△△ボタンをクリックすると□□が起きる
        - エラーの場合は〇〇メッセージが表示される

  - type: input
    id: spec-link
    attributes:
      label: 関連仕様書
      description: 既存の仕様書がある場合はパスを記入してください（新規の場合は「新規作成予定」）
      placeholder: "docs/spec/xxx.md または 新規作成予定"

  - type: input
    id: constitution-ref
    attributes:
      label: 憲章との整合性
      description: Constitution.md のどの原則・制約に関連しますか？
      placeholder: "例: 第2章 基本原則に準拠 / 制約なし"

  - type: dropdown
    id: priority
    attributes:
      label: 優先度
      options:
        - Must（リリース必須）
        - Should（重要・可能な限り含める）
        - Could（あれば望ましい）
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: その他・補足
      description: 参考資料・関連 Issue・注意事項などがあれば記載してください。
