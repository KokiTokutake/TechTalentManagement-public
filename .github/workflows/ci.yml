name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ──────────────────────────────────────────
  # 仕様書整合性チェック
  # ──────────────────────────────────────────
  spec-check:
    name: 仕様書チェック
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 仕様書ステータス確認
        run: |
          echo "=== 仕様書ステータス確認 ==="
          DRAFT_SPECS=$(grep -rl "status: draft\|status: review" docs/spec/ 2>/dev/null || true)
          if [ -n "$DRAFT_SPECS" ]; then
            echo "⚠️  未承認の仕様書があります:"
            echo "$DRAFT_SPECS"
            exit 0
          else
            echo "✅ 全仕様書が承認済みです"
          fi

      - name: 仕様書フォーマット確認
        run: |
          echo "=== 仕様書必須セクション確認 ==="
          MISSING=0
          for spec in docs/spec/*.md; do
            [ -f "$spec" ] || continue
            [[ "$spec" == *"_README"* ]] && continue
            if ! grep -q "## 1\. 背景\|## 1\. Why\|##.*Why" "$spec"; then
              echo "⚠️  Why セクションが見当たりません: $spec"
              MISSING=$((MISSING + 1))
            fi
            if ! grep -q "受入基準\|Acceptance" "$spec"; then
              echo "⚠️  受入基準セクションが見当たりません: $spec"
              MISSING=$((MISSING + 1))
            fi
          done
          if [ $MISSING -eq 0 ]; then
            echo "✅ 仕様書フォーマット確認完了"
          fi

  # ──────────────────────────────────────────
  # バックエンド（ASP.NET Core）
  # ──────────────────────────────────────────
  backend:
    name: バックエンド（.NET）
    runs-on: ubuntu-latest
    needs: spec-check
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: .NET セットアップ
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.x"

      - name: 依存関係の復元
        run: dotnet restore

      - name: ビルド
        run: dotnet build --no-restore -c Release

      - name: テスト
        run: dotnet test --no-build -c Release --logger "console;verbosity=minimal"

  # ──────────────────────────────────────────
  # フロントエンド（Nuxt.js）
  # ──────────────────────────────────────────
  frontend:
    name: フロントエンド（Nuxt.js）
    runs-on: ubuntu-latest
    needs: spec-check
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Node.js セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: 依存関係インストール
        run: npm ci

      - name: 型生成
        run: npx nuxt prepare

      - name: 型チェック
        run: npx vue-tsc --noEmit

      - name: リント
        run: npm run lint || true

      - name: ビルド
        run: npm run build

  # ──────────────────────────────────────────
  # PR 品質チェック
  # ──────────────────────────────────────────
  pr-check:
    name: PR 品質チェック
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: PR 説明確認
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          echo "=== PR 説明チェック ==="
          if echo "$PR_BODY" | grep -q "受入基準\|Acceptance"; then
            echo "✅ 受入基準の記載あり"
          else
            echo "⚠️  PR の説明に受入基準が含まれていません"
          fi
          if echo "$PR_BODY" | grep -qE "#[0-9]+|closes|fixes|resolves"; then
            echo "✅ 関連 Issue の記載あり"
          else
            echo "⚠️  関連 Issue が記載されていません"
          fi
