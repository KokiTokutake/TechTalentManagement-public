name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ──────────────────────────────────────────
  # 仕様書整合性チェック
  # ──────────────────────────────────────────
  spec-check:
    name: 仕様書チェック
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 仕様書ステータス確認
        run: |
          echo "=== 仕様書ステータス確認 ==="
          DRAFT_SPECS=$(grep -rl "status: draft\|status: review" docs/spec/ 2>/dev/null || true)
          if [ -n "$DRAFT_SPECS" ]; then
            echo "⚠️  未承認の仕様書があります:"
            echo "$DRAFT_SPECS"
            exit 0
          else
            echo "✅ 全仕様書が承認済みです"
          fi

      - name: 仕様書フォーマット確認
        run: |
          echo "=== 仕様書必須セクション確認 ==="
          MISSING=0
          for spec in docs/spec/*.md; do
            [ -f "$spec" ] || continue
            [[ "$spec" == *"_README"* ]] && continue
            if ! grep -q "## 1\. 背景\|## 1\. Why\|##.*Why" "$spec"; then
              echo "⚠️  Why セクションが見当たりません: $spec"
              MISSING=$((MISSING + 1))
            fi
            if ! grep -q "受入基準\|Acceptance" "$spec"; then
              echo "⚠️  受入基準セクションが見当たりません: $spec"
              MISSING=$((MISSING + 1))
            fi
          done
          if [ $MISSING -eq 0 ]; then
            echo "✅ 仕様書フォーマット確認完了"
          fi

  # ──────────────────────────────────────────
  # バックエンド（ASP.NET Core）
  # ──────────────────────────────────────────
  backend:
    name: バックエンド（.NET）
    runs-on: ubuntu-latest
    needs: spec-check
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: .NET セットアップ
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.x"

      - name: 依存関係の復元
        run: dotnet restore

      - name: ビルド
        run: dotnet build --no-restore -c Release

      - name: テスト
        run: dotnet test --no-build -c Release --logger "console;verbosity=minimal"

  # ──────────────────────────────────────────
  # フロントエンド（Nuxt.js）
  # ──────────────────────────────────────────
  frontend:
    name: フロントエンド（Nuxt.js）
    runs-on: ubuntu-latest
    needs: spec-check
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Node.js セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: 依存関係インストール
        run: npm ci

      - name: 型生成
        run: npx nuxt prepare

      - name: 型チェック
        run: npx vue-tsc --noEmit

      - name: リント
        run: npm run lint || true

      - name: ビルド
        run: npm run build

  # ──────────────────────────────────────────
  # E2E テスト（スキップ率チェック）
  # ──────────────────────────────────────────
  e2e-check:
    name: E2E テスト品質チェック
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - name: テストファイルのスキップ率確認
        run: |
          echo "=== E2E テスト スキップ率チェック ==="
          if [ ! -d "tests/e2e" ]; then
            echo "⚠️  tests/e2e/ ディレクトリが見つかりません"
            exit 0
          fi
          TOTAL=$(grep -r "^test(" tests/e2e/*.spec.ts 2>/dev/null | wc -l || echo 0)
          SKIPPED=$(grep -r "test\.skip" tests/e2e/*.spec.ts 2>/dev/null | wc -l || echo 0)
          if [ "$TOTAL" -gt 0 ]; then
            SKIP_RATE=$(( SKIPPED * 100 / TOTAL ))
            echo "総テスト数: $TOTAL / スキップ: $SKIPPED（スキップ率: $SKIP_RATE%）"
            if [ "$SKIP_RATE" -gt 50 ]; then
              echo "⚠️  スキップ率が 50% を超えています。テスト品質を確認してください。"
              echo "    スキップは外部サービス不可避の場合のみ許容されます（理由コメント必須）"
              # 警告のみ（exit 1 しない）— CI は通過させるが可視化する
            else
              echo "✅ スキップ率は許容範囲内です"
            fi
          fi

      - name: test.skip に理由記述があるか確認
        run: |
          echo "=== test.skip の理由記述チェック ==="
          # 理由なし（第2引数なし）の test.skip を検出
          NO_REASON=$(grep -rn "test\.skip()" tests/e2e/*.spec.ts 2>/dev/null || true)
          if [ -n "$NO_REASON" ]; then
            echo "⚠️  理由のない test.skip() が見つかりました:"
            echo "$NO_REASON"
            echo "    test.skip(true, '理由') の形式で理由を記載してください"
          else
            echo "✅ 全ての test.skip に理由が記載されています"
          fi

  # ──────────────────────────────────────────
  # PR 品質チェック
  # ──────────────────────────────────────────
  pr-check:
    name: PR 品質チェック
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: PR 説明確認
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          echo "=== PR 説明チェック ==="
          if echo "$PR_BODY" | grep -q "受入基準\|Acceptance"; then
            echo "✅ 受入基準の記載あり"
          else
            echo "⚠️  PR の説明に受入基準が含まれていません"
          fi
          if echo "$PR_BODY" | grep -qE "#[0-9]+|closes|fixes|resolves"; then
            echo "✅ 関連 Issue の記載あり"
          else
            echo "⚠️  関連 Issue が記載されていません"
          fi
