<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SDD Project Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ══════════════ SIDEBAR ══════════════ -->
<nav id="sidebar">
  <div class="sidebar-header">
    <div class="app-name">SDD Project Manager</div>
    <div class="project-name" id="sidebar-project-name">読み込み中…</div>
  </div>

  <div class="sidebar-nav">
    <div class="nav-section-label">メイン</div>
    <a class="nav-item active" data-view="dashboard">
      <span class="nav-icon">📊</span> ダッシュボード
    </a>
    <a class="nav-item" data-view="specs">
      <span class="nav-icon">📄</span> 仕様書管理
    </a>
    <a class="nav-item" data-view="tasks">
      <span class="nav-icon">✅</span> タスクボード
    </a>

    <div class="nav-section-label">スプリント</div>
    <a class="nav-item" data-view="sprints">
      <span class="nav-icon">🏃</span> スプリント管理
    </a>
    <a class="nav-item" data-view="retros">
      <span class="nav-icon">🔄</span> ふりかえり
    </a>

    <div class="nav-section-label">管理</div>
    <a class="nav-item" data-view="issues">
      <span class="nav-icon">🐛</span> 課題・ブロッカー
    </a>
    <a class="nav-item" data-view="settings">
      <span class="nav-icon">⚙️</span> 設定
    </a>
  </div>

  <!-- 同期ステータスバー -->
  <div class="sync-bar">
    <div id="sync-status"><span class="sync-dot disconnected"></span>未接続</div>
    <button class="sync-connect-btn" id="sync-connect-btn" onclick="SDD.fs.connect()">📁 接続</button>
  </div>
</nav>

<!-- ══════════════ MAIN ══════════════ -->
<div id="main">
  <!-- topbar -->
  <div class="topbar">
    <div class="view-title" id="topbar-title">ダッシュボード</div>
    <div class="actions" id="topbar-actions"></div>
  </div>

  <!-- content -->
  <div id="content">
    <div class="empty-state">読み込み中…</div>
  </div>
</div>

<!-- ══════════════ MODAL ══════════════ -->
<div class="modal-overlay hidden" id="modal-overlay">
  <div class="modal-box">
    <div class="modal-header">
      <h2 id="modal-title">モーダル</h2>
      <button class="modal-close" id="modal-close-btn" aria-label="閉じる">&times;</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer">
      <button class="btn btn-ghost" id="modal-cancel-btn">キャンセル</button>
      <button class="btn btn-primary" id="modal-save-btn">保存</button>
    </div>
  </div>
</div>

<script src="js/init-config.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
